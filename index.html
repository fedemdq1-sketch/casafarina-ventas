<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Farina — Sistema de Ventas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #022859; --blue: #056BF0;
    --light-blue: #B0D0FC; --pink: #B35689; --green: #00916E;
    --bg: #f5f5f3; --surface: #ffffff; --border: rgba(0,0,0,0.1);
    --text: #1a1a1a; --text-2: #555; --text-3: #999;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app-header { background: var(--navy); padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-waves { display: flex; flex-direction: column; gap: 3px; }
  .logo-wave { height: 2.5px; border-radius: 2px; background: var(--light-blue); }
  .logo-wave:nth-child(1){width:20px} .logo-wave:nth-child(2){width:15px} .logo-wave:nth-child(3){width:10px}
  .logo-name { color:#fff; font-size:15px; font-weight:600; }
  .logo-sub { color:var(--light-blue); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }
  .header-right { color:rgba(176,208,252,0.7); font-size:11px; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#aaa; margin-right:5px; vertical-align:middle; }
  .status-dot.online { background:#4ade80; }
  .tabs { display:flex; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:48px; z-index:99; }
  .tab { flex:1; padding:12px; font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--text-2); border-bottom:2px solid transparent; display:flex; align-items:center; justify-content:center; gap:6px; }
  .tab.active { color:var(--navy); border-bottom-color:var(--navy); }
  .tab .badge { background:var(--pink); color:#fff; font-size:10px; padding:1px 6px; border-radius:10px; font-weight:600; }
  .screen { display:none; max-width:640px; margin:0 auto; padding:16px; }
  .screen.active { display:block; }
  .section { margin-bottom:18px; }
  .section-label { font-size:10px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:8px; }
  .sel-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .sel-btn { position:relative; padding:9px 6px 8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text-2); cursor:pointer; font-size:12px; text-align:center; transition:all 0.12s; }
  .sel-btn:hover { border-color:var(--navy); color:var(--navy); }
  .sel-btn.selected { background:var(--navy); color:#fff; border-color:var(--navy); }
  .sel-btn .tick { display:none; position:absolute; top:3px; right:4px; font-size:9px; }
  .sel-btn.selected .tick { display:block; }
  .field { width:100%; padding:9px 12px; font-size:13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); height:36px; }
  .field:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(2,40,89,0.08); }
  .quick-wrap { display:flex; flex-wrap:wrap; gap:6px; }
  .quick-btn { padding:5px 12px; border:1px solid var(--border); border-radius:20px; background:var(--surface); color:var(--text-2); cursor:pointer; font-size:12px; transition:all 0.1s; white-space:nowrap; }
  .quick-btn:hover { background:var(--navy); color:#fff; border-color:var(--navy); }
  .search-wrap { position:relative; }
  .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-3); pointer-events:none; }
  .search-field { width:100%; padding:9px 12px 9px 34px; font-size:13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); height:36px; }
  .search-field:focus { outline:none; border-color:var(--navy); box-shadow:0 0 0 3px rgba(2,40,89,0.08); }
  .search-drop { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); z-index:200; max-height:220px; overflow-y:auto; box-shadow:0 8px 24px rgba(2,40,89,0.12); display:none; }
  .search-item { padding:9px 14px; font-size:13px; cursor:pointer; color:var(--text); border-bottom:1px solid var(--border); }
  .search-item:last-child { border-bottom:none; }
  .search-item:hover { background:#EBF0F8; }
  .search-item mark { background:var(--light-blue); color:var(--navy); border-radius:2px; padding:0 1px; font-weight:600; font-style:normal; }
  .search-empty { padding:14px; font-size:13px; color:var(--text-3); text-align:center; }
  .divider { display:flex; align-items:center; gap:10px; margin:4px 0; }
  .divider span { font-size:11px; color:var(--text-3); white-space:nowrap; }
  .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
  .col-header { display:grid; grid-template-columns:80px 1fr 95px 34px; gap:6px; margin-bottom:4px; }
  .col-header span { font-size:10px; color:var(--text-3); text-transform:uppercase; letter-spacing:0.05em; }
  .row-item { display:grid; grid-template-columns:80px 1fr 95px 34px; gap:6px; align-items:center; margin-bottom:5px; }
  .qty-wrap { display:flex; align-items:stretch; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; height:34px; background:var(--surface); }
  .qty-btn { width:26px; border:none; background:#f0f0ee; color:var(--text-2); cursor:pointer; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .qty-btn:hover { background:#e0e0dc; color:var(--navy); }
  .qty-val { flex:1; text-align:center; font-size:13px; font-weight:600; color:var(--text); display:flex; align-items:center; justify-content:center; border-left:1px solid var(--border); border-right:1px solid var(--border); }
  .item-inp { width:100%; padding:6px 8px; font-size:13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); height:34px; }
  .item-inp:focus { outline:none; border-color:var(--navy); }
  .price-inp { text-align:right; }
  .btn-remove { width:34px; height:34px; border:1px solid var(--border); border-radius:var(--radius); background:transparent; color:var(--text-3); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; }
  .btn-remove:hover { color:#c0392b; border-color:#c0392b; }
  .btn-add { width:100%; padding:7px; border:1px dashed var(--border); border-radius:var(--radius); background:transparent; color:var(--text-3); cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; gap:5px; margin-top:6px; }
  .btn-add:hover { background:#f0f0ee; color:var(--text); }
  .nota-field { width:100%; padding:8px 12px; font-size:13px; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); color:var(--text); resize:none; height:52px; font-family:inherit; }
  .nota-field:focus { outline:none; border-color:var(--navy); }
  .total-bar { background:var(--navy); border-radius:var(--radius-lg); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .total-label { font-size:10px; color:var(--light-blue); text-transform:uppercase; letter-spacing:0.1em; }
  .total-amount { font-size:26px; font-weight:600; color:#fff; margin-top:2px; }
  .total-pago { font-size:12px; color:rgba(176,208,252,0.8); text-align:right; }
  .btn-send { width:100%; padding:12px; background:var(--blue); color:#fff; border:none; border-radius:var(--radius); font-size:15px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-send:hover { background:#0459c5; }
  .btn-send:disabled { background:#aaa; cursor:not-allowed; }
  .caja-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:12px; }
  .caja-tab { flex:1; padding:9px; font-size:13px; font-weight:500; cursor:pointer; border:none; background:transparent; color:var(--text-2); border-bottom:2px solid transparent; }
  .caja-tab.active { color:var(--navy); border-bottom-color:var(--blue); }
  .pedido-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; margin-bottom:10px; }
  .pedido-card.nuevo { border-left:3px solid var(--navy); animation:slidein 0.3s ease; }
  @keyframes slidein { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:none} }
  .pedido-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:8px; }
  .pedido-meta { display:flex; flex-direction:column; gap:2px; }
  .pedido-cliente { font-size:16px; font-weight:600; color:var(--text); }
  .pedido-num { font-size:11px; color:var(--text-3); }
  .pedido-vend { font-size:11px; color:var(--text-3); }
  .pago-tag { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:600; white-space:nowrap; }
  .pago-tag.efectivo{background:#EAF3DE;color:#3B6D11} .pago-tag.debito{background:#E6F1FB;color:#185FA5}
  .pago-tag.credito{background:#FAEEDA;color:#854F0B} .pago-tag.transferencia{background:#F1EFE8;color:#5F5E5A}
  .pedido-items { margin-bottom:10px; }
  .item-row { display:flex; align-items:center; padding:4px 0; border-bottom:1px solid var(--border); gap:8px; font-size:13px; color:var(--text-2); }
  .item-row:last-child { border-bottom:none; }
  .item-qty { font-size:11px; background:#f0f0ee; color:var(--text-3); border-radius:4px; padding:1px 7px; flex-shrink:0; font-weight:600; }
  .item-desc { flex:1; }
  .item-price { white-space:nowrap; font-weight:500; color:var(--text); }
  .hist .item-row { font-size:14px; }
  .hist .pago-tag { font-size:12px; }
  .pedido-footer { display:flex; justify-content:space-between; align-items:center; padding-top:10px; border-top:1px solid var(--border); }
  .pedido-total { font-size:20px; font-weight:700; color:var(--navy); }
  .btn-cobrado { padding:7px 18px; background:var(--green); color:#fff; border:none; border-radius:var(--radius); font-size:13px; font-weight:600; cursor:pointer; }
  .btn-cobrado:hover { background:#007a5c; }
  .cobrado-tag { font-size:12px; padding:4px 12px; border-radius:20px; background:#EAF3DE; color:#3B6D11; font-weight:600; }
  .empty-state { text-align:center; padding:50px 20px; color:var(--text-3); font-size:14px; }
  .empty-icon { font-size:40px; margin-bottom:10px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 22px; border-radius:30px; font-size:13px; font-weight:500; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:999; white-space:nowrap; box-shadow:0 4px 20px rgba(2,40,89,0.3); }
  .toast.show { opacity:1; }
</style>
</head>
<body>

<div class="app-header">
  <div class="logo">
    <div class="logo-waves">
      <div class="logo-wave"></div><div class="logo-wave"></div><div class="logo-wave"></div>
    </div>
    <div>
      <div class="logo-name">Casa Farina</div>
      <div class="logo-sub">Sistema de ventas</div>
    </div>
  </div>
  <div class="header-right">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Conectando...</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('mostrador')" id="tab-mostrador">🛒 Mostrador</button>
  <button class="tab" onclick="switchTab('caja')" id="tab-caja">🏧 Caja <span class="badge" id="badge-caja" style="display:none">0</span></button>
</div>

<div class="screen active" id="screen-mostrador">
  <div class="section">
    <p class="section-label">Vendedor</p>
    <div class="sel-grid" id="vendedor-grid"></div>
  </div>
  <div class="section">
    <p class="section-label">Cliente</p>
    <input class="field" id="cliente-input" type="text" placeholder="Nombre del cliente (opcional)..." autocomplete="off"/>
  </div>
  <div class="section">
    <p class="section-label">Carga rápida</p>
    <div class="quick-wrap" id="quick-grid"></div>
  </div>
  <div class="section">
    <p class="section-label">Buscar en catálogo</p>
    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-field" id="search-input" type="text" placeholder="Escribí para buscar..." autocomplete="off"/>
      <div class="search-drop" id="search-drop"></div>
    </div>
  </div>
  <div class="divider"><span>o agregá manualmente</span></div>
  <div class="section">
    <div class="col-header">
      <span style="text-align:center">Cant.</span>
      <span>Descripción</span>
      <span style="text-align:right">Precio c/u</span>
      <span></span>
    </div>
    <div id="items-container"></div>
    <button class="btn-add" onclick="addItem()">＋ Agregar producto</button>
  </div>
  <div class="section">
    <p class="section-label">Forma de pago</p>
    <div class="sel-grid" id="pago-grid"></div>
  </div>
  <div class="section">
    <p class="section-label">Nota (opcional)</p>
    <textarea class="nota-field" id="nota-input" placeholder="Observaciones para caja..."></textarea>
  </div>
  <div class="total-bar">
    <div>
      <p class="total-label">Total</p>
      <p class="total-amount" id="total-display">$0</p>
    </div>
    <div><p class="total-pago" id="pago-display">Sin forma de pago</p></div>
  </div>
  <button class="btn-send" id="btn-enviar" onclick="enviarACaja()">↗ Enviar a caja</button>
  <div style="height:20px"></div>
</div>

<div class="screen" id="screen-caja">
  <div class="caja-tabs">
    <button class="caja-tab active" onclick="switchCajaTab('pendientes')" id="ctab-pendientes">Pendientes</button>
    <button class="caja-tab" onclick="switchCajaTab('historial')" id="ctab-historial">Historial</button>
  </div>
  <div id="caja-pendientes"><div class="empty-state"><div class="empty-icon">📭</div>Sin pedidos pendientes</div></div>
  <div id="caja-historial" style="display:none"><div class="empty-state"><div class="empty-icon">🕐</div>Sin órdenes cobradas todavía</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// Inicializar Firebase
const firebaseConfig = {
  apiKey: "AIzaSyD5oo8CoXemEdFpCLEjvytQoeKGakj6wjY",
  authDomain: "mostrador-caja-cf.firebaseapp.com",
  databaseURL: "https://mostrador-caja-cf-default-rtdb.firebaseio.com",

  appId: "1:1002701666930:web:3016b17a4d117dee80e0eb"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const pedidosRef = db.ref('pedidos');

// Estado de conexión
db.ref('.info/connected').on('value', snap => {
  const ok = snap.val();
  document.getElementById('status-dot').className = 'status-dot' + (ok ? ' online' : '');
  document.getElementById('status-text').textContent = ok ? 'En línea' : 'Sin conexión';
});

// Escuchar pedidos en tiempo real
pedidosRef.orderByChild('timestamp').limitToLast(200).on('value', snap => {
  const data = snap.val() || {};
  const todos = Object.entries(data).map(([key, val]) => ({ fbKey: key, ...val }));
  todos.sort((a, b) => b.timestamp - a.timestamp);
  renderPendientes(todos.filter(p => p.estado === 'pendiente'));
  renderHistorial(todos.filter(p => p.estado === 'cobrado'));
  updateBadge(todos.filter(p => p.estado === 'pendiente').length);
});

// ── Enviar pedido ──────────────────────────────────────────────
function enviarACaja() {
  const valid = _items.filter(it => it.desc.trim() !== '' || it.precio !== '');
  if (!_vendedor)    { showToast('Seleccioná el vendedor'); return; }
  if (!valid.length) { showToast('Agregá al menos un producto'); return; }
  if (!_pago)        { showToast('Seleccioná la forma de pago'); return; }

  const cliente = document.getElementById('cliente-input').value.trim();
  const nota    = document.getElementById('nota-input').value.trim();
  const total   = valid.reduce((s, it) => s + (parseFloat(it.precio)||0) * (it.qty||1), 0);

  const btn = document.getElementById('btn-enviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  pedidosRef.push({
    timestamp: Date.now(),
    hora: new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
    items: valid,
    pago: _pago,
    vendedor: _vendedor,
    cliente: cliente || null,
    total: total,
    nota: nota || null,
    estado: 'pendiente'
  }).then(() => {
    _items = []; _vendedor = null; _pago = null;
    document.querySelectorAll('.vendedor-btn-ref, .pago-btn-ref').forEach(b => b.classList.remove('selected'));
    document.getElementById('pago-display').textContent = 'Sin forma de pago';
    document.getElementById('nota-input').value = '';
    document.getElementById('cliente-input').value = '';
    renderItems();
    showToast('✓ Pedido enviado a caja');
  }).catch(err => {
    showToast('Error: ' + err.message);
    console.error(err);
  }).finally(() => {
    btn.disabled = false;
    btn.textContent = '↗ Enviar a caja';
  });
}

// ── Marcar cobrado ─────────────────────────────────────────────
function cobrar(fbKey, num) {
  const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  db.ref('pedidos/' + fbKey).update({ estado: 'cobrado', cobradoEn: hora })
    .then(() => showToast('Pedido ' + num + ' cobrado'))
    .catch(err => showToast('Error: ' + err.message));
}

// ── Render cards ───────────────────────────────────────────────
function renderPendientes(list) {
  const c = document.getElementById('caja-pendientes');
  c.innerHTML = list.length ? list.map((p,i) => buildCard(p, true, i===0)).join('') :
    '<div class="empty-state"><div class="empty-icon">📭</div>Sin pedidos pendientes</div>';
}
function renderHistorial(list) {
  const c = document.getElementById('caja-historial');
  c.innerHTML = list.length ? list.map(p => buildCard(p, false, false)).join('') :
    '<div class="empty-state"><div class="empty-icon">🕐</div>Sin órdenes cobradas todavía</div>';
}
function buildCard(p, pendiente, esNuevo) {
  const pClass = p.pago==='Efectivo'?'efectivo':p.pago==='Débito'?'debito':p.pago==='Crédito'?'credito':'transferencia';
  const hora = pendiente ? p.hora : (p.hora + ' → cobrado ' + p.cobradoEn);
  const num  = p.timestamp ? '#' + String(p.timestamp).slice(-4) : '';
  const cli  = p.cliente ? '<span class="pedido-cliente">' + p.cliente + '</span>' : '';
  const nota = p.nota ? '<p style="font-size:12px;color:#888;font-style:italic;margin-bottom:8px">' + p.nota + '</p>' : '';
  const items = (p.items||[]).map(it => {
    const q=it.qty||1, pr=parseFloat(it.precio)||0;
    return '<div class="item-row"><span class="item-qty">'+q+'x</span><span class="item-desc">'+it.desc+'</span><span class="item-price">'+(pr?'$'+(pr*q).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2}):'—')+'</span></div>';
  }).join('');
  const accion = pendiente
    ? '<button class="btn-cobrado" onclick="cobrar(\''+p.fbKey+'\',\''+num+'\')">✓ Cobrado</button>'
    : '<span class="cobrado-tag">✓ Cobrado</span>';
  return '<div class="pedido-card'+(pendiente&&esNuevo?' nuevo':'')+(pendiente?'':' hist')+'">'
    +'<div class="pedido-header"><div class="pedido-meta">'+cli
    +'<span class="pedido-num">Pedido '+num+' · '+hora+'</span>'
    +'<span class="pedido-vend">Vendedor: '+p.vendedor+'</span></div>'
    +'<span class="pago-tag '+pClass+'">'+p.pago+'</span></div>'
    +'<div class="pedido-items">'+items+'</div>'
    +nota
    +'<div class="pedido-footer"><span class="pedido-total">$'+p.total.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2})+'</span>'+accion+'</div></div>';
}

(function initVendedores() {
  const g = document.getElementById('vendedor-grid');
  VENDEDORES.forEach(v => {
    const b = document.createElement('button');
    b.className = 'sel-btn vendedor-btn-ref';
    b.innerHTML = '<span class="tick">✓</span>' + v;
    b.onclick = () => { _vendedor = v; document.querySelectorAll('.vendedor-btn-ref').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); };
    g.appendChild(b);
  });
})();

(function initPagos() {
  const g = document.getElementById('pago-grid');
  PAGOS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'sel-btn pago-btn-ref';
    b.innerHTML = '<span class="tick">✓</span>' + p;
    b.onclick = () => { _pago = p; document.querySelectorAll('.pago-btn-ref').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); document.getElementById('pago-display').textContent = p; };
    g.appendChild(b);
  });
})();

(function initRapidos() {
  const g = document.getElementById('quick-grid');
  RAPIDOS.forEach(n => {
    const b = document.createElement('button'); b.className = 'quick-btn'; b.textContent = n;
    b.onclick = () => addItemDesde(n); g.appendChild(b);
  });
})();

// Buscador
const searchInp  = document.getElementById('search-input');
const searchDrop = document.getElementById('search-drop');
let searchTimer  = null;
searchInp.addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => doSearch(searchInp.value.trim()), 130); });
searchInp.addEventListener('focus', () => { if (searchInp.value.trim().length >= 2) doSearch(searchInp.value.trim()); });
document.addEventListener('click', e => { if (!document.getElementById('search-wrap').contains(e.target)) searchDrop.style.display = 'none'; });

function doSearch(q) {
  if (q.length < 2) { searchDrop.style.display = 'none'; return; }
  const words = q.toUpperCase().split(/\s+/).filter(Boolean);
  const matches = CATALOGO.filter(p => words.every(w => p.includes(w))).slice(0, 30);
  searchDrop.innerHTML = matches.length
    ? matches.map(p => { let h=p; words.forEach(w=>{const re=new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(re,m=>'<mark>'+m+'</mark>');}); return '<div class="search-item" onclick="selectSearch(\''+p.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')">' + h + '</div>'; }).join('')
    : '<div class="search-empty">Sin resultados</div>';
  searchDrop.style.display = 'block';
}
function selectSearch(n) { addItemDesde(n); searchInp.value=''; searchDrop.style.display='none'; }

function addItemDesde(n) {
  const idx = _items.findIndex(it => it.desc === n);
  if (idx >= 0) { _items[idx].qty++; renderItems(); return; }
  _items.push({ desc: n, precio: '', qty: 1 }); renderItems();
  setTimeout(() => { const inp=document.querySelectorAll('.price-inp'); if(inp.length) inp[inp.length-1].focus(); }, 30);
}
function addItem() {
  _items.push({ desc:'', precio:'', qty:1 }); renderItems();
  setTimeout(() => { const inp=document.querySelectorAll('.item-inp:not(.price-inp)'); if(inp.length) inp[inp.length-1].focus(); }, 30);
}
function removeItem(i) { _items.splice(i,1); renderItems(); }
function changeQty(i,d) { _items[i].qty=Math.max(1,(_items[i].qty||1)+d); renderItems(); }

function renderItems() {
  const c = document.getElementById('items-container'); c.innerHTML='';
  if (!_items.length) {
    c.innerHTML='<p style="font-size:12px;color:#aaa;padding:5px 0">Seleccioná un producto o buscá en el catálogo</p>';
    updateTotal(); return;
  }
  _items.forEach((it,i) => {
    const r=document.createElement('div'); r.className='row-item';
    r.innerHTML='<div class="qty-wrap"><button class="qty-btn" onclick="changeQty('+i+',-1)">−</button><span class="qty-val">'+it.qty+'</span><button class="qty-btn" onclick="changeQty('+i+',1)">+</button></div>'
      +'<input class="item-inp" type="text" placeholder="Descripción" value="'+it.desc.replace(/"/g,'&quot;')+'" oninput="_items['+i+'].desc=this.value"/>'
      +'<input class="item-inp price-inp" type="number" placeholder="$ c/u" value="'+it.precio+'" oninput="_items['+i+'].precio=this.value;updateTotal()" min="0" step="0.01"/>'
      +'<button class="btn-remove" onclick="removeItem('+i+')" aria-label="Quitar">✕</button>';
    c.appendChild(r);
  });
  updateTotal();
}
function updateTotal() {
  const t=_items.reduce((s,it)=>s+(parseFloat(it.precio)||0)*(it.qty||1),0);
  document.getElementById('total-display').textContent='$'+t.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
}

// ── Tabs ───────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}
function switchCajaTab(tab) {
  document.getElementById('caja-pendientes').style.display = tab==='pendientes'?'block':'none';
  document.getElementById('caja-historial').style.display  = tab==='historial'?'block':'none';
  document.getElementById('ctab-pendientes').classList.toggle('active', tab==='pendientes');
  document.getElementById('ctab-historial').classList.toggle('active',  tab==='historial');
}
function updateBadge(n) {
  const b=document.getElementById('badge-caja'); b.textContent=n; b.style.display=n>0?'inline':'none';
}
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

renderItems();
</script>
